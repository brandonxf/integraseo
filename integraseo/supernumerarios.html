<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supernumerarios</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1 id="header-title">Supernumerarios</h1>
            <div class="header-search">
                <input type="search" id="supernumerarios-search" placeholder="Buscar supernumerario" aria-label="Buscar supernumerarios" />
                <button class="btn-search" id="btn-supernumerarios-search" aria-label="Buscar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main">
            <div class="supernumerarios-container">
                <!-- Estado vacío -->
                <div class="empty-state">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <h3>No hay supernumerarios registrados</h3>
                    <p>Los supernumerarios asignados aparecerán aquí</p>
                </div>
                <!-- Los supernumerarios se cargarán dinámicamente aquí -->
            </div>
        </main>

        <!-- Botón para exportar a Excel -->
        <button class="fab fab-export" id="btn-export-excel" aria-label="Exportar a Excel" title="Exportar a Excel">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        </button>

        <!-- Floating Menu Button -->
        <button class="fab" id="btn-menu-fab" aria-label="Menú de opciones">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>

        <!-- Modal para agregar supernumerario -->
        <div class="modal hidden" id="modal-supernumerario">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Nuevo Supernumerario</h3>
                    <button class="btn-close" id="btn-close-supernumerario-modal">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <form id="form-supernumerario">
                    <div class="form-group">
                        <label for="sup-fecha">Fecha</label>
                        <input type="date" id="sup-fecha" required>
                    </div>
                    <div class="form-group">
                        <label for="sup-nombre">Nombre del Supernumerario</label>
                        <input type="text" id="sup-nombre" placeholder="Nombre completo" required>
                    </div>
                    <div class="form-group">
                        <label for="sup-trabajo">Trabajo Realizado</label>
                        <textarea id="sup-trabajo" placeholder="Descripción del trabajo realizado" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="sup-contrato">Contrato</label>
                        <select id="sup-contrato" required>
                            <option value="">Seleccionar contrato</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-cancel" id="btn-cancel-supernumerario">Cancelar</button>
                        <button type="submit" class="btn-save">Guardar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Modal para editar supernumerario -->
        <div class="modal hidden" id="modal-edit-supernumerario">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Editar Supernumerario</h3>
                    <button class="btn-close" id="btn-close-edit-supernumerario-modal">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <form id="form-edit-supernumerario">
                    <div class="form-group">
                        <label for="edit-sup-fecha">Fecha</label>
                        <input type="date" id="edit-sup-fecha" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-sup-nombre">Nombre del Supernumerario</label>
                        <input type="text" id="edit-sup-nombre" placeholder="Nombre completo" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-sup-trabajo">Trabajo Realizado</label>
                        <textarea id="edit-sup-trabajo" placeholder="Descripción del trabajo realizado" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="edit-sup-contrato">Contrato</label>
                        <select id="edit-sup-contrato" required>
                            <option value="">Seleccionar contrato</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-cancel" id="btn-cancel-edit-supernumerario">Cancelar</button>
                        <button type="submit" class="btn-save">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Modal de confirmación para eliminar -->
        <div class="confirm-modal hidden" id="modal-confirm-delete">
            <div class="confirm-content">
                <div class="confirm-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </div>
                <div class="confirm-title">¿Eliminar Supernumerario?</div>
                <div class="confirm-message">Esta acción no se puede deshacer</div>
                <div class="confirm-actions">
                    <button class="confirm-btn confirm-btn-cancel" id="btn-cancel-delete">Cancelar</button>
                    <button class="confirm-btn confirm-btn-delete" id="btn-confirm-delete">Eliminar</button>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                    <polyline points="13 2 13 9 20 9"></polyline>
                </svg>
                <span>Contratos</span>
            </a>
            <a href="calendario.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>Calendario</span>
            </a>
            <a href="recordatorios.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span>Recordatorios</span>
            </a>
            <a href="brigadas.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <circle cx="17" cy="7" r="3"></circle>
                </svg>
                <span>Brigadas</span>
            </a>
            <a href="supernumerarios.html" class="nav-item active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Supernumerarios</span>
            </a>
        </nav>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        // Asegurar que XLSX está disponible
        window.xlsxReady = false;
        setTimeout(() => {
            if (window.XLSX) {
                window.xlsxReady = true;
                console.log('XLSX está disponible');
            } else {
                console.log('XLSX NO está disponible');
            }
        }, 1000);
    </script>
    <script type="module" src="supernumerarios.js"></script>
</body>
</html>
