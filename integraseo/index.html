<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contratos - Gestión de Contratos</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#07105e">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1 id="header-title">Contratos</h1>
            <div class="header-search">
                <input type="search" id="contracts-search" placeholder="Buscar contrato" aria-label="Buscar contratos" />
                <button class="btn-search" id="btn-contracts-search" aria-label="Buscar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main" id="app-main">
            <!-- Contracts List View -->
            <div class="view" id="contracts-view">
                <div class="contracts-list" id="contracts-list">
                    <!-- Contracts will be dynamically added here -->
                </div>
            </div>

            <!-- Contract Detail View -->
            <div class="view hidden" id="contract-detail-view">
                <div class="detail-container">
                    <div class="detail-header">
                        <button class="btn-back" id="btn-back-detail">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg>
                        </button>
                        <div class="detail-info">
                            <h2 id="detail-title"></h2>
                            <p id="detail-subtitle"></p>
                        </div>
                        <button class="btn-edit" id="btn-edit-contract">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                        </button>
                    </div>

                    <!-- Tabs -->
                    <div class="tabs">
                        <button class="tab active" data-tab="info">Información</button>
                        <button class="tab" data-tab="notes">Notas</button>
                        <button class="tab" data-tab="workers">Operarios</button>
                        <button class="tab" data-tab="visits">Visitas</button>
                    </div>

                    <!-- Tab Content -->
                    <div class="tab-content">
                        <div class="tab-panel active" id="tab-info">
                            <div class="info-section" id="contract-info"></div>
                        </div>

                        <div class="tab-panel" id="tab-notes">
                            <div class="notes-container">
                                <button class="btn-add-note" id="btn-add-note">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="12" y1="5" x2="12" y2="19"></line>
                                        <line x1="5" y1="12" x2="19" y2="12"></line>
                                    </svg>
                                    Añadir Nota
                                </button>
                                <div class="notes-list" id="notes-list"></div>
                            </div>
                        </div>

                        <div class="tab-panel" id="tab-workers">
                            <div class="workers-container">
                                <button class="btn-add-worker" id="btn-add-worker">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="12" y1="5" x2="12" y2="19"></line>
                                        <line x1="5" y1="12" x2="19" y2="12"></line>
                                    </svg>
                                    Añadir Operario
                                </button>
                                <div class="workers-list" id="workers-list"></div>
                            </div>
                        </div>

                        <div class="tab-panel" id="tab-visits">
                            <div class="visits-container">
                                <div class="visits-calendar">
                                    <div class="calendar-header">
                                        <button class="btn-calendar-nav" id="btn-prev-month-visits">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <polyline points="15 18 9 12 15 6"></polyline>
                                            </svg>
                                        </button>
                                        <h2 id="calendar-month-year-visits"></h2>
                                        <button class="btn-calendar-nav" id="btn-next-month-visits">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <polyline points="9 18 15 12 9 6"></polyline>
                                            </svg>
                                        </button>
                                    </div>
                                    <div class="calendar-weekdays">
                                        <div>Dom</div>
                                        <div>Lun</div>
                                        <div>Mar</div>
                                        <div>Mié</div>
                                        <div>Jue</div>
                                        <div>Vie</div>
                                        <div>Sáb</div>
                                    </div>
                                    <div class="calendar-grid" id="visits-calendar-grid"></div>
                                    <div class="visits-list" id="visits-list"></div>
                                    <!-- Sección de visitas confirmadas -->
                                    <div class="confirmed-visits-section">
                                        <h3>Visitas Confirmadas</h3>
                                        <div class="confirmed-visits-list" id="confirmed-visits-list">
                                            <!-- Las visitas confirmadas se mostrarán aquí -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Calendar View -->
            <div class="view hidden" id="calendar-view">
                <div class="calendar-container">
                    <div class="calendar-header">
                        <button class="btn-calendar-nav" id="btn-prev-month">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg>
                        </button>
                        <h2 id="calendar-month-year"></h2>
                        <button class="btn-calendar-nav" id="btn-next-month">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </button>
                    </div>
                    <button class="btn-add-event" id="btn-add-event">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Añadir Evento
                    </button>
                    <div class="calendar-grid" id="calendar-grid"></div>
                    <div class="events-list" id="events-list"></div>
                </div>
            </div>

            <!-- Reminders View -->
            <div class="view hidden" id="reminders-view">
                <div class="reminders-container">
                    <button class="btn-add-reminder" id="btn-add-reminder">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Añadir Recordatorio
                    </button>
                    <div class="reminders-list" id="reminders-list"></div>
                </div>
            </div>
        </main>

        <!-- Floating Add Contract Button -->
        <button class="fab" id="btn-add-contract-fab" aria-label="Añadir contrato">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>

        <!-- Bottom Navigation -->
                <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                    <polyline points="13 2 13 9 20 9"></polyline>
                </svg>
                <span>Contratos</span>
            </a>
            <a href="calendario.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>Calendario</span>
            </a>
            <a href="recordatorios.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span>Recordatorios</span>
            </a>
            <a href="brigadas.html" class="nav-item">
                <!-- Icono de brigadas: versión consistente con los demás iconos -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <circle cx="17" cy="7" r="3"></circle>
                </svg>
                <span>Brigadas</span>
            </a>
            <a href="supernumerarios.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Supernumerarios</span>
            </a>
        </nav>
    </div>

    <!-- Register service worker for PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(reg) { console.log('ServiceWorker registrado:', reg.scope); })
                    .catch(function(err) { console.warn('Error registrando ServiceWorker:', err); });
            });
        }
    </script>

    <!-- Modal for Add/Edit Contract -->
    <div class="modal hidden" id="modal-contract">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-contract-title">Nuevo Contrato</h3>
                <button class="btn-close" id="btn-close-contract-modal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <form id="form-contract">
                <div class="form-group">
                    <label for="contract-name">Nombre del Contrato</label>
                    <input type="text" id="contract-name" required>
                </div>
                <div class="form-group">
                    <label for="contract-client">Cliente</label>
                    <input type="text" id="contract-client" required>
                </div>
                <div class="form-group">
                    <label for="contract-location">Ubicación</label>
                    <input type="text" id="contract-location">
                </div>
                <div class="form-group">
                    <label for="contract-value">Valor Agregado</label>
                    <div class="value-items" id="value-items">
                        <!-- Los items de valor agregado se añadirán aquí -->
                    </div>
                    <input type="text" id="value-input" placeholder="Ejemplo: 1 jardinero" class="value-input">
                    <button type="button" class="btn-add-value" id="btn-add-value">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Agregar operario
                    </button>
                </div>
                <div class="form-group">
                    <label for="contract-status">Estado</label>
                    <select id="contract-status">
                        <option value="active">Activo</option>
                        <option value="pending">Pendiente</option>
                        <option value="completed">Completado</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="btn-cancel-contract">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Add Note -->
    <div class="modal hidden" id="modal-note">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Nueva Nota</h3>
                <button class="btn-close" id="btn-close-note-modal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <form id="form-note">
                <div class="form-group">
                    <label for="note-date">Fecha</label>
                    <input type="date" id="note-date" required>
                </div>
                <div class="form-group">
                    <label for="note-time">Hora</label>
                    <input type="time" id="note-time" required>
                </div>
                <div class="form-group">
                    <label for="note-content">Contenido</label>
                    <textarea id="note-content" rows="4" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="btn-cancel-note">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Add Worker -->
    <div class="modal hidden" id="modal-worker">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Nuevo Operario</h3>
                <button class="btn-close" id="btn-close-worker-modal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <form id="form-worker">
                <div class="form-group">
                    <label for="worker-name">Nombre</label>
                    <input type="text" id="worker-name" required>
                </div>
                <div class="form-group">
                    <label for="worker-position">Cargo</label>
                    <input type="text" id="worker-position" required>
                </div>
                <div class="form-group">
                    <label for="worker-phone">Teléfono</label>
                    <input type="tel" id="worker-phone">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="btn-cancel-worker">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Add Event -->
    <div class="modal hidden" id="modal-event">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Nuevo Evento</h3>
                <button class="btn-close" id="btn-close-event-modal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <form id="form-event">
                <div class="form-group">
                    <label for="event-title">Título</label>
                    <input type="text" id="event-title" required>
                </div>
                <div class="form-group">
                    <label for="event-date">Fecha</label>
                    <input type="date" id="event-date" required>
                </div>
                <div class="form-group">
                    <label for="event-time">Hora</label>
                    <input type="time" id="event-time" required>
                </div>
                <div class="form-group">
                    <label for="event-description">Descripción</label>
                    <textarea id="event-description" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="btn-cancel-event">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Add Reminder -->
    <div class="modal hidden" id="modal-reminder">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Nuevo Recordatorio</h3>
                <button class="btn-close" id="btn-close-reminder-modal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <form id="form-reminder">
                <div class="form-group">
                    <label for="reminder-title">Título</label>
                    <input type="text" id="reminder-title" required>
                </div>
                <div class="form-group">
                    <label for="reminder-date">Fecha</label>
                    <input type="date" id="reminder-date" required>
                </div>
                <div class="form-group">
                    <label for="reminder-time">Hora</label>
                    <input type="time" id="reminder-time" required>
                </div>
                <div class="form-group">
                    <label for="reminder-description">Descripción</label>
                    <textarea id="reminder-description" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="btn-cancel-reminder">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de confirmación de visita -->
    <div class="modal hidden" id="modal-visit-confirm">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Confirmar Visita</h3>
                <button class="btn-close" id="btn-close-visit-modal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="confirm-content">
                <p class="confirm-message">¿Desea confirmar la visita para el día <span id="visit-date-text"></span>?</p>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="btn-cancel-visit">No</button>
                    <button type="button" class="btn-primary" id="btn-confirm-visit">Sí</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module" src="app.js"></script>
</body>
</html>
